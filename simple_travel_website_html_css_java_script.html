<style>
body { font-family: Arial, sans-serif; background: #f5f7fa; margin: 0; }
header { background: #1e90ff; color: white; padding: 20px; text-align: center; }
.container { padding: 30px; text-align: center; }
.card { background: white; padding: 20px; margin: 20px auto; width: 300px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
button { padding: 12px 20px; border: none; background: #1e90ff; color: white; font-size: 16px; border-radius: 5px; cursor: pointer; }
button:hover { background: #0f6fd1; }
</style>

<body>
<header>
  <h1>TravelNow</h1>
  <p>Discover. Book. Explore.</p>
</header>
<div class="container">
  <div class="card">
    <h2>Goa Beach Trip</h2>
    <p>3 Nights • Flights + Hotel</p>
    <button onclick="bookTrip('Goa')">Book Now</button>
  </div>
  <div class="card">
    <h2>Manali Adventure</h2>
    <p>5 Nights • Trekking Included</p>
    <button onclick="bookTrip('Manali')">Book Now</button>
  </div>
</div>
<script>
function bookTrip(destination) {
    /* GOOGLE */
    gtag('event', 'book_trip', {
        destination: destination,
        value: 500,
        currency: 'USD'
    });

    /* META */
    fbq('track', 'Purchase', {
        content_name: destination,
        value: 500,
        currency: 'USD'
    });

    /* TIKTOK */
    ttq.track('CompletePayment', {
        content_name: destination,
        value: 500,
        currency: 'USD'
    });

    /* AMAZON - Custom non-standard event */
    amzn('trackEvent', 'TravelCheckout', {
        value: '750',
        currency: 'INR',
        attr1: destination,
        attr2: 'premium_package',
        attr3: '5nights'
    });

    alert('Tracking fired for ' + destination);
}
</script>
</body>
